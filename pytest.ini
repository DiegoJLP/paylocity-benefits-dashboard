[pytest]
# discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --alluredir=reports/allure-results
    --clean-alluredir
    -v
    --tb=short

markers =
    smoke: Core happy-path tests that should run on every commit
    regression: Full regression suite
    api: API tests thus no browser needed
    ui: UI tests that need browser
    auth: Authentication tests
    negative: Negative and edge case tests
    a11y: Accessibility tests

log_cli = true
#ERROR, WARNING, INFO, DEBUG
log_cli_level = INFO 
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
log_file = reports/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s (%(filename)s:%(lineno)d): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S